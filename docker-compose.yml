version: "3.9"
services:
  db:
    image: postgres:16
    container_name: finance_postgres
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: finance_redis
    ports:
      - "6379:6379"
  backend:
    build: .
    container_name: finance_backend
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://finance_user:finance_password@db:5432/finance_tracker
      REDIS_URL: redis://redis:6379
      SECRET_KEY: my-super-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
volumes:
  postgres_data:
